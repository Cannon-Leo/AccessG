<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AccessG - Ticket Pass Component Proof</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    /* CSS Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--color-inverse-surface);
      color: var(--color-on-surface);
      font-family: var(--type-body-medium-font-family);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .verification-card {
      background-color: var(--color-surface);
      border-radius: 1.25rem;
      box-shadow: var(--shadow-medium-shadow);
      width: 100%;
      max-width: 24rem;
      overflow: hidden;
      border: 1px solid var(--color-outline-variant);
    }

    .card-header {
      background-color: var(--color-primary-container);
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--color-outline-variant);
    }

    .pass-type-badge {
      display: inline-block;
      font-family: var(--type-label-small-font-family);
      font-size: var(--type-label-small-size);
      font-weight: var(--type-label-small-weight);
      line-height: var(--type-label-small-line-height);
      letter-spacing: var(--type-label-small-letter-spacing);
      text-transform: uppercase;
      background-color: var(--color-primary);
      color: var(--color-on-primary-fixed);
      padding: 0.25rem 0.625rem;
      border-radius: 9999px;
      margin-bottom: 0.5rem;
    }

    .event-title {
      font-family: var(--type-headline-small-font-family);
      font-size: var(--type-headline-small-size);
      font-weight: var(--type-headline-small-weight);
      line-height: var(--type-headline-small-line-height);
      letter-spacing: var(--type-headline-small-letter-spacing);
      color: var(--color-on-surface);
    }

    .card-body {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed var(--color-outline-variant);
      padding-bottom: 0.5rem;
    }

    .detail-label {
      font-family: var(--type-body-small-font-family);
      font-size: var(--type-body-small-size);
      color: var(--color-on-surface-variant);
    }

    .detail-value {
      font-family: var(--type-title-small-font-family);
      font-size: var(--type-title-small-size);
      font-weight: var(--type-title-small-weight);
      color: var(--color-on-surface);
    }

    .qr-container {
      background-color: var(--color-surface-variant);
      border-radius: 0.75rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      box-shadow: var(--shadow-soft-shadow);
    }

    .qr-mock {
      width: 8rem;
      height: 8rem;
      background: repeating-conic-gradient(
        var(--color-on-surface) 0% 25%,
        var(--color-surface) 0% 50%
      ) 50% / 1rem 1rem;
      border-radius: 0.5rem;
      border: 4px solid var(--color-surface);
    }

    .qr-subtext {
      font-family: var(--type-label-small-font-family);
      font-size: var(--type-label-small-size);
      color: var(--color-on-surface-variant);
      letter-spacing: var(--type-label-small-letter-spacing);
    }

    .card-footer {
      padding: 1.25rem 1.5rem;
      background-color: var(--color-surface);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .btn-primary {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      background-color: var(--color-primary);
      color: var(--color-on-primary-fixed);
      font-family: var(--type-label-large-font-family);
      font-size: var(--type-label-large-size);
      font-weight: 700;
      line-height: var(--type-label-large-line-height);
      letter-spacing: var(--type-label-large-letter-spacing);
      padding: 0.875rem 1.5rem;
      border-radius: 0.75rem;
      border: none;
      cursor: pointer;
      box-shadow: var(--shadow-soft-shadow);
      transition: box-shadow 0.2s ease, transform 0.1s ease;
    }

    .btn-primary:hover {
      box-shadow: var(--shadow-medium-shadow);
      transform: translateY(-1px);
    }

    .status-note {
      font-family: var(--type-body-small-font-family);
      font-size: var(--type-body-small-size);
      color: var(--color-on-surface-variant);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="verification-card">
    <div class="card-header">
      <span class="pass-type-badge">Gate Pass &bull; Verified</span>
      <h2 class="event-title">AccessG Neon Sessions 01</h2>
    </div>

    <div class="card-body">
      <div class="detail-row">
        <span class="detail-label">Attendee</span>
        <span class="detail-value">Leo Cannon</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Pass Tier</span>
        <span class="detail-value">Studio Access (L-20)</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Gate Window</span>
        <span class="detail-value">21:00 - 02:00</span>
      </div>

      <div class="qr-container">
        <div class="qr-mock" role="img" aria-label="Pass QR Code"></div>
        <p class="qr-subtext">Scan at venue portal 4</p>
      </div>
    </div>

    <div class="card-footer">
      <button class="btn-primary" type="button">Store Offline Pass</button>
      <p class="status-note">Cached locally in IndexedDB for offline scanning</p>
    </div>
  </div>
</body>
</html>
